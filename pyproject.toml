[project]
name = "agentledger"
version = "0.1.0"
description = "Evidence-bound, tamper-evident, control-mapped auditing of agent logs"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
hosted = ["anthropic>=0.40"]
groq = ["groq>=0.11"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
